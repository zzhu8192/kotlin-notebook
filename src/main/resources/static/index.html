<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kotlin Notebook</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong colors.
    document.documentElement.dataset.theme = localStorage.getItem("kotnb.theme")
      ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img src="favicon.svg" alt="" width="22" height="22">
      <span>Kotlin Notebook</span>
    </div>
    <button id="new-notebook" class="button primary new-notebook" type="button">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></span>
      New notebook
    </button>
    <nav aria-label="Notebooks">
      <div class="section-label">Notebooks</div>
      <ul id="notebook-list"></ul>
      <p id="list-empty" class="list-empty" hidden>No notebooks yet.</p>
    </nav>
    <div class="sidebar-footer">
      <span id="version"></span>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme"></button>
    </div>
  </aside>

  <main>
    <div id="workspace" hidden>
      <header id="toolbar">
        <div class="title-area">
          <h1 id="notebook-title" title="Rename notebook"></h1>
          <span id="save-state"></span>
        </div>
        <div class="toolbar-actions">
          <button id="run-all" class="button" type="button" title="Run all cells">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2 2.8v10.4c0 .6.6.9 1.1.6l7.2-5.2c.5-.3.5-.9 0-1.2L3.1 2.2C2.6 1.9 2 2.2 2 2.8z"/><path d="M11 2.5h1.5a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.5.5H11a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5z"/></svg></span>
            Run all
          </button>
          <button id="interrupt" class="button" type="button" title="Interrupt the running cell and cancel queued ones">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg></span>
            Interrupt
          </button>
          <button id="restart" class="button" type="button" title="Restart the kernel, discarding all state">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg></span>
            Restart
          </button>
          <button id="clear-outputs" class="button" type="button" title="Clear all outputs">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h10M5.2 10.5 10.8 3.8M4 10.5h3"/></svg></span>
            Clear
          </button>
          <span class="toolbar-separator"></span>
          <span id="kernel-state" class="kernel-state"><span class="kernel-dot"></span><span id="kernel-label"></span></span>
          <button id="delete-notebook" class="icon-button danger" type="button" title="Delete notebook" aria-label="Delete notebook">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 8.6c0 .5.5.9 1 .9h4.6c.5 0 1-.4 1-.9l.7-8.6M6.7 7v4.5M9.3 7v4.5"/></svg></span>
          </button>
        </div>
      </header>
      <div id="cells"></div>
    </div>

    <div id="empty-state" hidden>
      <div class="empty-card">
        <img src="favicon.svg" alt="" width="40" height="40">
        <h2>No notebook open</h2>
        <p>Pick a notebook on the left, or start a new one.</p>
        <button id="empty-new" class="button primary" type="button">New notebook</button>
      </div>
    </div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
